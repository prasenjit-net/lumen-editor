[package]
name = "lumen-editor-surface"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
egui = { version = "0.33", features = ["accesskit"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
lumen-editor-core = { path = "../editor-core" }
