[package]
name = "lumen-editor"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask", "crates/editor-core", "crates/editor-surface", "crates/settings-core"]
default-members = ["."]
resolver = "3"

[features]
default = ["shared-editor"]
shared-editor = ["dep:lumen-editor-surface", "lumen-editor-surface/shaped"]

[dependencies]
eframe = "0.33"
rfd = "0.15"
trash = "5.2"
arboard = { version = "3.6", default-features = false }
tempfile = "3"
unicode-segmentation = "1.13"
lumen-settings-core = { path = "crates/settings-core" }
lumen-editor-core = { path = "crates/editor-core" }
lumen-editor-surface = { path = "crates/editor-surface", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
