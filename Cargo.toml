[package]
name = "lumen-editor"
version = "0.1.2"
edition = "2024"
description = "A focused native file editor"

[package.metadata.deb]
maintainer = "Lumen contributors"
section = "devel"
priority = "optional"
assets = [
    ["target/release/lumen-editor", "usr/bin/lumen", "755"],
    ["assets/icons/lumen.png", "usr/share/icons/hicolor/1024x1024/apps/lumen.png", "644"],
    ["packaging/linux/lumen.desktop", "usr/share/applications/lumen.desktop", "644"],
]

[package.metadata.generate-rpm]
summary = "A focused native file editor"
license = "Proprietary"
assets = [
    { source = "target/release/lumen-editor", dest = "/usr/bin/lumen", mode = "755" },
    { source = "assets/icons/lumen.png", dest = "/usr/share/icons/hicolor/1024x1024/apps/lumen.png", mode = "644" },
    { source = "packaging/linux/lumen.desktop", dest = "/usr/share/applications/lumen.desktop", mode = "644" },
]

[workspace]
members = ["xtask", "crates/editor-core", "crates/editor-surface", "crates/language-services", "crates/settings-core", "crates/terminal-core"]
default-members = ["."]
resolver = "3"

[features]
default = ["shared-editor"]
shared-editor = ["dep:lumen-editor-surface", "lumen-editor-surface/shaped"]

[dependencies]
eframe = "0.33"
rfd = "0.15"
trash = "5.2"
arboard = { version = "3.6", default-features = false }
alacritty_terminal = "0.25"
tempfile = "3"
ignore = "0.4"
portable-pty = "0.9"
serde_json = "1"
unicode-segmentation = "1.13"
toml_edit = "0.25"
lumen-settings-core = { path = "crates/settings-core" }
lumen-editor-core = { path = "crates/editor-core" }
lumen-editor-surface = { path = "crates/editor-surface", optional = true }
lumen-language-services = { path = "crates/language-services" }
lumen-terminal-core = { path = "crates/terminal-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
