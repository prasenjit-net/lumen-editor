[package]
name = "lumen-editor"
version = "0.5.1"
edition = "2024"
description = "A focused native file editor"

[package.metadata.deb]
maintainer = "Lumen contributors"
section = "devel"
priority = "optional"
assets = [
    ["target/release/lumen-editor", "usr/bin/lumen", "755"],
    ["assets/icons/lumen.png", "usr/share/icons/hicolor/1024x1024/apps/lumen.png", "644"],
    ["packaging/linux/lumen.desktop", "usr/share/applications/lumen.desktop", "644"],
]

[package.metadata.generate-rpm]
summary = "A focused native file editor"
license = "Proprietary"
assets = [
    { source = "target/release/lumen-editor", dest = "/usr/bin/lumen", mode = "755" },
    { source = "assets/icons/lumen.png", dest = "/usr/share/icons/hicolor/1024x1024/apps/lumen.png", mode = "644" },
    { source = "packaging/linux/lumen.desktop", dest = "/usr/share/applications/lumen.desktop", mode = "644" },
]

[workspace]
members = ["xtask", "crates/agent-claude", "crates/agent-codex", "crates/agent-core", "crates/agent-protocol", "crates/editor-core", "crates/editor-surface", "crates/language-services", "crates/settings-core", "crates/task-core", "crates/terminal-core"]
default-members = ["."]
resolver = "3"

[features]
# Language-server integration (diagnostics, completion, navigation). Off for now:
# without it no server is ever started and editors use the built-in syntax highlighting.
language-server = []

[dependencies]
eframe = "0.33"
rfd = "0.15"
trash = "5.2"
arboard = { version = "3.6", default-features = false }
alacritty_terminal = "0.25"
tempfile = "3"
ignore = "0.4"
portable-pty = "0.9"
serde_json = "1"
unicode-segmentation = "1.13"
toml_edit = "0.25"
lumen-agent-claude = { path = "crates/agent-claude" }
lumen-agent-codex = { path = "crates/agent-codex" }
lumen-agent-core = { path = "crates/agent-core" }
lumen-settings-core = { path = "crates/settings-core" }
lumen-editor-core = { path = "crates/editor-core" }
lumen-editor-surface = { path = "crates/editor-surface" }
lumen-language-services = { path = "crates/language-services" }
lumen-terminal-core = { path = "crates/terminal-core" }
lumen-task-core = { path = "crates/task-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
lumen-agent-core = { path = "crates/agent-core", features = ["testing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
