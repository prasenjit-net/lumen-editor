name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to increment from Cargo.toml'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version and validate source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bump version from the default branch
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run releases from the default branch ($DEFAULT_BRANCH)" >&2
            exit 1
          fi
          version="$(cargo run --locked --package xtask -- bump-version "$RELEASE_BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos:
    name: macOS bundle
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo run --locked --package xtask -- set-version "$RELEASE_VERSION"
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo xtask bundle --release
      - name: Package signed-ready DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          hdiutil create -volname Lumen -srcfolder target/Lumen.app -ov -format UDZO "dist/Lumen-v${RELEASE_VERSION}-macos-${RUNNER_ARCH}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows executable
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo run --locked --package xtask -- set-version $env:RELEASE_VERSION
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Locate or install WiX Toolset
        shell: pwsh
        run: |
          $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $candle) {
            choco install wixtoolset --yes --no-progress
            $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $candle) {
            throw "WiX Toolset candle.exe was not found after installation"
          }
          "WIX_BIN=$($candle.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$env:WIX_BIN\candle.exe" -nologo "-dSourceDir=$PWD\target\release" "-dVersion=$env:RELEASE_VERSION" packaging\windows\Lumen.wxs -out dist\Lumen.wixobj
          & "$env:WIX_BIN\light.exe" -nologo -out "dist\Lumen-v$env:RELEASE_VERSION-windows-$env:RUNNER_ARCH.msi" dist\Lumen.wixobj
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux executable
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo run --locked --package xtask -- set-version "$RELEASE_VERSION"
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Install Linux package builders
        run: |
          cargo install --locked cargo-deb --version 3.8.0
          cargo install --locked cargo-generate-rpm --version 0.21.0
      - name: Package DEB and RPM
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          cargo deb --no-build --output "dist/Lumen-v${RELEASE_VERSION}-linux-${RUNNER_ARCH}.deb"
          cargo generate-rpm -o "dist/Lumen-v${RELEASE_VERSION}-linux-${RUNNER_ARCH}.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: lumen-*
          path: dist
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          (cd dist && sha256sum Lumen-* > SHA256SUMS)
      - name: Commit and tag the tested version
        id: tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BASE_COMMIT: ${{ needs.prepare.outputs.base }}
        run: |
          tag="v$RELEASE_VERSION"
          git fetch origin --tags "refs/heads/$DEFAULT_BRANCH"
          if git rev-parse --verify -q "refs/tags/${tag}^{commit}" >/dev/null; then
            release_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$(git rev-parse "${release_commit}^")" != "$BASE_COMMIT" ]]; then
              echo "Existing tag $tag does not belong to this release attempt" >&2
              exit 1
            fi
          else
            if [[ "$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)" != "$BASE_COMMIT" ]]; then
              echo "Default branch advanced during the release; start a new run" >&2
              exit 1
            fi
            cargo run --locked --package xtask -- set-version "$RELEASE_VERSION"
            git add Cargo.toml Cargo.lock assets/macos/Info.plist
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit -m "Release $tag"
            git tag -a "$tag" -m "Lumen $tag"
            git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$tag"
            release_commit="$(git rev-parse HEAD)"
          fi
          if ! git show "$release_commit:Cargo.toml" | grep -Fq "version = \"$RELEASE_VERSION\""; then
            echo "Tagged commit does not contain release version $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite its assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --verify-tag --title "Lumen $RELEASE_TAG" --generate-notes
