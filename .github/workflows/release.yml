name: Release

on:
  push:
    branches:
      - 'r[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Existing release branch, for example r0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release and source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Validate release branch
        id: branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^r(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release branch such as r0.1.0, got: $RELEASE_BRANCH" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/heads/$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${RELEASE_BRANCH#r}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Match branch, crate and macOS bundle versions
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.branch.outputs.version }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "lumen-editor") | .version')"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release branch version $RELEASE_VERSION does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          if ! grep -Fq "<key>CFBundleShortVersionString</key><string>$RELEASE_VERSION</string>" assets/macos/Info.plist; then
            echo "macOS Info.plist version does not match $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos:
    name: macOS bundle
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo xtask bundle --release
      - name: Package app bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/Lumen.app "dist/Lumen-v${RELEASE_VERSION}-macos-${RUNNER_ARCH}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows executable
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Package executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lumen-editor.exe -DestinationPath "dist/Lumen-v$env:RELEASE_VERSION-windows-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux executable
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Package executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/Lumen-v${RELEASE_VERSION}-linux-${RUNNER_ARCH}.tar.gz" lumen-editor
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: lumen-*
          path: dist
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          (cd dist && sha256sum Lumen-* > SHA256SUMS)
      - name: Create release from the validated commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to replace a published release" >&2
            exit 1
          fi
          gh release create "$tag" dist/* --target "$RELEASE_COMMIT" --title "Lumen $tag" --generate-notes
